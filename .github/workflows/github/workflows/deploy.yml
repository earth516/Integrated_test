# 파일 위치: .github/workflows/deploy.yml
# 깃허브에 파일을 올릴 때마다 문제 목록(manifest.json)을 자동으로 만들고 사이트에 배포해요.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build manifest.json
        run: |
          python3 - <<'PY'
          import os, re, json, unicodedata
          pat = re.compile(r'^(\d+)번_문제\.png$')
          m = {}
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              nums = sorted(int(x.group(1)) for f in files if (x := pat.match(unicodedata.normalize('NFC', f))))
              if nums:
                  rel = os.path.relpath(root, '.').replace(os.sep, '/')
                  book, _, unit = rel.rpartition('/')
                  m.setdefault(book, {})[unit] = nums
          json.dump(m, open('manifest.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(json.dumps({b: {u: len(v) for u, v in us.items()} for b, us in m.items()}, ensure_ascii=False, indent=1))
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
